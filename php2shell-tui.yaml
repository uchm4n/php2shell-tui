targets:
  - https://example1.com
  - https://example2.com
  - https://example3.com
  - url: https://legacy.example4.com
    paths: ["/wp-content/uploads"]
    staging: true

  - url: https://legacy.example5.com
    paths: [ "/admin", "/wp-admin", "/login" ]

checks:
  php_presence: true
  php_version: true
  php2shell: true                     # active check; inert unless --verify + poc.guess/poc_profile
  sensitive_files: true
  security_headers: true
  tls: true
  app_fingerprint: true
  webshell_indicators: true
  open_ports: true
  injection: false                    # requires --verify as well

poc:
  guess: true                         # try the ordered list; still requires --verify
  arch: any                           # any | amd64 | aarch64
  workers: 150                        # prefork workers to pin; set to the target's actual count
  max_attempts: 2                     # stop after this many profiles; raise to cover the whole list
  total_timeout: 100                  # seconds across all attempts
  timeout: 10                         # seconds per attempt
  max_workers: 150                    # refuse a profile above this pin count
  profiles:
    - php-8.4.26-apache-bookworm-amd64
    - php-8.5.11-apache-bookworm-amd64
    - php-8.5.11-apache-bookworm-aarch64
    - php-8.5.10-apache-bookworm-aarch64
    - php-8.5.0-apache-bookworm-aarch64
    - php-8.4.25-apache-bookworm-aarch64
    - php-8.3.35-apache-bookworm-aarch64
    - php-8.3.33-wordpress-mod_php
    - php-8.3.0-apache-bookworm-aarch64
    - php-8.2.34-apache-bookworm-aarch64
    - php-8.2.0-apache-bookworm-aarch64
    - php-8.1.34-apache-bookworm-aarch64
    - php-8.0.30-apache-bookworm-aarch64
    - php-7.4.33-apache-bookworm-aarch64
    # No public profiles for 5.4–7.3; 7.4.33 is the oldest available.

options:
  concurrency: 8
  timeout: 10                        # seconds, per request
  connect_timeout: 5
  delay_ms: 100                      # per-host politeness delay
  user_agent: "php2shell-tui/0.0.1 (+https://example.com/about)"
  min_severity: medium               # below this severity: excluded from the text/markdown
                                     # report and from the exit code, but still shown in the
                                     # TUI and in JSON output

output:
  format: tui                        # tui | text | json | markdown
  report_dir: ./reports
